apiVersion: apps/v1
kind: Deployment

metadata: 
  name: backend
  namespace: secondBrain

spec: 
  replicas: 2

  selector: 
    matchLabels: 
      app: backend

  template:
    metadata: 
      labels: 
        app: backend

    spec: 
      container: 
        - name: backend
          image: visheshverma07/second-brain-backend:IMAGE_TAG

          ports:
            - containerPort: 8080

          envFrom: 
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secrete