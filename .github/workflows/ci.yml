name: CI

on: 
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      
      - name: Install Dependecny
        run: npm install

      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
  
  frontend: 
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults: 
      run:
        working-directory: frontend-updated

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-updated/package-lock.json

      - name: Install Dependecny
        run: npm install
      
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build